name: Build UltraStream APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ultrastream-android
    paths:
      - 'ultrastream/**'
      - '.github/workflows/ultrastream-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultrastream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UltraStream-debug-apk
          path: ultrastream/app/build/outputs/apk/debug/app-debug.apk
