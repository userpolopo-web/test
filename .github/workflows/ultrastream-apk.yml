name: Build and Release UltraStream APK
on:
  workflow_dispatch:
  push:
    branches: [feature/ultrastream-android]
    paths:
      - 'ultrastream/**'
      - '.github/workflows/ultrastream-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultrastream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug :tv:assembleDebug --stacktrace
      - name: Prepare download filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk UltraStream-Android-0.2.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk UltraStream-TV-0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UltraStream-debug-apk
          path: ultrastream/UltraStream-*.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ultrastream-v0.2.0-build-${{ github.run_number }}" ./UltraStream-Android-0.2.apk ./UltraStream-TV-0.2.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "UltraStream 0.2.0 Android + TV (teste) - build ${{ github.run_number }}" \
            --notes "Dois APKs de teste: Android transmissor e Android TV receptor. Pareamento por código local. Sem áudio." \
            --prerelease \
            --latest=false
